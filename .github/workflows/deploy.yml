# CI/CD: on every push to main, run the tests, then deploy to the GCE VM.
#
# Same shape as the EC2 pipeline it replaces - the only differences are the
# secret names and the fact that the login user on GCE is derived from your
# Google account rather than being "ubuntu".
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   GCP_HOST      the VM's reserved static external IP
#   GCP_USER      your GCE login name (e.g. romanempirealkaif)
#   GCP_SSH_KEY   contents of the PRIVATE key whose public half is in the
#                 VM's ssh-keys metadata
#
# NOTE: the deploy job does NOT use gcloud or a service account. It is a plain
# SSH deploy, so there is no GCP credential sitting in GitHub - only a key that
# can log into one VM.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # allow manual runs from the Actions tab

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the valuation test suite
        # Pure, offline unit tests - no API key needed. A failure here blocks
        # the deploy, so broken arithmetic never reaches the live site.
        run: pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USER: ${{ secrets.GCP_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$GCP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$GCP_USER@$GCP_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/financial-copilot
            git fetch --all
            git reset --hard origin/main
            ./venv/bin/pip install -q -r requirements.txt
            sudo systemctl restart financial-copilot
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u)"
          REMOTE
