# nginx reverse proxy: public port 80 -> Streamlit on 127.0.0.1:8501.
#
# This gives a clean link (http://<your-ip>/ with no :8501) and keeps Streamlit
# bound to localhost so it is only reachable through nginx. The WebSocket
# upgrade headers are required - without them Streamlit connects but never
# finishes loading, showing a blank page.
#
# Installed to /etc/nginx/sites-available/ by deploy/setup.sh.

server {
    listen 80 default_server;
    server_name _;

    # Filings and generated reports can be several megabytes.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket upgrade - mandatory for Streamlit's live connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit streams long responses (report generation); don't cut them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
