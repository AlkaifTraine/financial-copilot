[theme]
# Matches the report's palette so the app and the generated document read as
# one product rather than two.
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#14181f"
font = "sans serif"

[server]
# Filings are large; the default 200MB cap is generous but explicit here.
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Strips the hamburger menu, the "Deploy" button and the developer toolbar from
# the top-right corner - the single most recognisable piece of Streamlit chrome.
# This is an official Streamlit setting, not a hack.
toolbarMode = "minimal"

# A public demo must never show a visitor a Python traceback. Errors are logged
# server-side and the visitor sees a clean message instead. A recruiter meeting
# a raw stack trace is a worse outcome than a vague error.
showErrorDetails = "none"
